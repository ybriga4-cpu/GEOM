<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publications — GEOM</title>
<meta name="description" content="Études, notes d'analyse, annonces et vidéos de GEOM, en accès libre.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">

</head>
<body>

<div id="site-header"></div>

<main>
  <div class="wrap"><a class="back-home" href="index.html">&larr; Retour à l'accueil</a></div>
  <section style="padding-bottom:0">
    <div class="wrap">
      <p class="eyebrow">Publications &amp; ressources</p>
      <h1>Bibliothèque en accès libre</h1>
      <p class="lede">Études, notes d'analyse, annonces et vidéos de GEOM — consultables librement, sans inscription.</p>
    </div>
  </section>

  <section data-tabs>
    <div class="wrap">
      <div class="tabs">
        <button type="button" class="tab-btn is-active" data-tab="tab-etudes">Études &amp; notes</button>
        <button type="button" class="tab-btn" data-tab="tab-annonces">Annonces</button>
        <button type="button" class="tab-btn" data-tab="tab-videos">Vidéos</button>
      </div>

      <div id="tab-etudes" class="tab-panel is-active">
        <div class="filters" data-filter-group>
          <button type="button" class="filter-btn is-active" data-filter="all">Tous les axes</button>
          <button type="button" class="filter-btn" data-filter="economie">Économie</button>
          <button type="button" class="filter-btn" data-filter="commerce">Commerce international</button>
          <button type="button" class="filter-btn" data-filter="investissement">Investissement</button>
        </div>
        <div class="pub-list" data-pub-list></div>
      </div>

      <div id="tab-annonces" class="tab-panel">
        <div class="pub-list" data-announce-list></div>
      </div>

      <div id="tab-videos" class="tab-panel">
        <div class="video-grid" data-video-list></div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/js/site-chrome.js"></script>
<script src="assets/js/main.js"></script>
<script>
  renderPublications('[data-pub-list]', { filterGroup: '[data-filter-group]' });
  renderAnnouncements('[data-announce-list]');
  renderVideos('[data-video-list]');
  initTabs('[data-tabs]');
</script>
</body>
</html>
